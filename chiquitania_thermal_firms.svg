<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Filtros y gradientes para efecto satelital térmico -->
    <radialGradient id="hotspot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#991b1b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hotspot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="smokePlume" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#cbd5e1" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1" />
    </linearGradient>
    <filter id="thermalBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="smokeBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Fondo de terreno satelital (Infrarrojo de falso color SWIR/NIR) -->
  <rect width="800" height="500" fill="#0b1b14" />
  
  <!-- Relieve y masa forestal / sabana -->
  <path d="M0,0 L800,0 L800,500 L0,500 Z" fill="#0f291e" />
  <path d="M120,40 Q280,180 190,320 T400,480 L0,500 L0,0 Z" fill="#081e15" opacity="0.85" />
  <path d="M480,0 Q620,120 540,280 T800,420 L800,0 Z" fill="#133e2b" opacity="0.9" />
  <path d="M260,180 Q390,260 520,200 T780,290 L680,500 L200,500 Z" fill="#1e2922" opacity="0.75" />

  <!-- Cicatriz de quema previa (Burn scar - color marrón rojizo oscuro en SWIR) -->
  <path d="M210,180 Q320,140 460,190 T560,310 Q490,400 340,380 T210,310 Z" fill="#2d130a" stroke="#7f1d1d" stroke-width="2" opacity="0.8" />
  <path d="M380,240 Q450,210 520,250 T540,340 Q480,390 390,360 Z" fill="#1c0a06" opacity="0.9" />

  <!-- Penacho de humo denso impulsado por viento noreste hacia sudoeste -->
  <path d="M250,210 C180,140 80,110 0,80 L0,220 C70,260 160,280 230,260 Z" fill="url(#smokePlume)" filter="url(#smokeBlur)" />
  <path d="M420,260 C320,180 180,140 40,110 L20,290 C150,330 310,340 410,300 Z" fill="url(#smokePlume)" filter="url(#smokeBlur)" opacity="0.85" />
  <path d="M520,290 C430,220 300,180 150,150 L140,320 C270,360 420,370 510,330 Z" fill="url(#smokePlume)" filter="url(#smokeBlur)" opacity="0.7" />

  <!-- Frentes activos de fuego (Bandas térmicas VIIRS I4 / MODIS Band 21) -->
  <!-- Línea de fuego 1 (Frente principal activo) -->
  <path d="M220,190 Q290,165 370,185 T490,240" fill="none" stroke="#ef4444" stroke-width="9" filter="url(#thermalBlur)" opacity="0.9" />
  <path d="M220,190 Q290,165 370,185 T490,240" fill="none" stroke="#fef08a" stroke-width="3" />

  <!-- Línea de fuego 2 (Frente secundario de avance rápido) -->
  <path d="M490,240 Q550,280 540,340" fill="none" stroke="#ea580c" stroke-width="8" filter="url(#thermalBlur)" opacity="0.85" />
  <path d="M490,240 Q550,280 540,340" fill="none" stroke="#ffffff" stroke-width="2.5" />

  <!-- Focos térmicos de alta radiación (Hotspots puntuales) -->
  <circle cx="230" cy="195" r="32" fill="url(#hotspot1)" />
  <circle cx="290" cy="175" r="38" fill="url(#hotspot1)" />
  <circle cx="360" cy="185" r="42" fill="url(#hotspot1)" />
  <circle cx="430" cy="215" r="36" fill="url(#hotspot1)" />
  <circle cx="495" cy="245" r="45" fill="url(#hotspot1)" />
  <circle cx="535" cy="290" r="34" fill="url(#hotspot2)" />
  <circle cx="540" cy="340" r="28" fill="url(#hotspot2)" />

  <!-- Puntos secundarios dispersos (Fuegos de chaqueo aislados) -->
  <circle cx="640" cy="160" r="18" fill="url(#hotspot2)" />
  <circle cx="680" cy="380" r="22" fill="url(#hotspot2)" />
  <circle cx="160" cy="380" r="16" fill="url(#hotspot2)" />

  <!-- Retícula de coordenadas satelitales y HUD de NASA FIRMS -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.4" stroke-dasharray="4,6">
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Marcas de posición HUD -->
  <rect x="20" y="20" width="310" height="95" rx="8" fill="#030712" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
  <text x="35" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">🛰️ NASA FIRMS | COMPUESTO TÉRMICO</text>
  <text x="35" y="62" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Sensor: VIIRS I-Band (375m) + MODIS</text>
  <text x="35" y="79" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11">FRP Máximo: 284.5 MW | Píxeles: 42 focos</text>
  <text x="35" y="97" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Coords: 16°18'S, 60°42'W (Chiquitania, BO)</text>

  <!-- Escala gráfica y brújula -->
  <g transform="translate(710, 40)">
    <circle cx="30" cy="30" r="24" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M30,12 L36,30 L30,26 L24,30 Z" fill="#ef4444" />
    <path d="M30,48 L36,30 L30,34 L24,30 Z" fill="#94a3b8" />
    <text x="30" y="10" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">N</text>
  </g>
</svg>